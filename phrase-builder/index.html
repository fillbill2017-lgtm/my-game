<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Я умею! — конструктор предложений</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f2f8ff,#f7f3ff);font:16px Arial;color:#24334d}.app{max-width:1050px;margin:auto;padding:18px}.top,.controls,.options{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-size:28px;font-weight:900;color:#5265bd}.pill,.panel{background:#fff;border:2px solid #e1eafa;border-radius:20px;padding:14px;box-shadow:0 8px 24px #31537a12}.prompt{text-align:center;margin:16px 0}.sentence{font-size:clamp(22px,4vw,34px);font-weight:900}.hint{color:#70809a;margin-top:8px}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.scene{min-height:330px;display:grid;place-items:center;background:linear-gradient(#aee0ff 0 60%,#8bd17b 60%);border-radius:15px;font-size:75px;position:relative;overflow:hidden}.scene .box{font-size:90px}.scene .ball{font-size:54px;position:absolute;left:54%;top:49%}.scene .boy{position:absolute;left:18%;top:26%}.caption{text-align:center;color:#7c899d;font-size:13px;margin-top:10px}.group{border:1px solid #d9e5f4;border-radius:14px;padding:10px;margin:9px 0;background:#fbfdff}.group h3{font-size:14px;color:#607493;margin:0 0 8px}.option{width:78px;height:70px;border:2px solid #d4e2f3;background:#fff;border-radius:14px;font-size:38px}.option[aria-pressed=true]{border:3px solid #2689df;background:#edf7ff}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:12px 0}.slot{border:2px dashed #cbd8e9;border-radius:12px;padding:8px;text-align:center;min-height:58px}.slot.filled{border-style:solid;background:#f0f8ff}.slot small{display:block;color:#8290a5;font-weight:bold}.slot b{display:block;margin:4px}.slot button{border:0;background:none;color:#267bc5;font-size:12px}.controls{justify-content:center}.check,.reset,.next{border:0;border-radius:13px;padding:12px 18px;font-weight:bold}.check{background:#23b65d;color:white}.reset{background:#edf3ff;color:#4569a1}.next{background:#6b61d4;color:#fff}.feedback{text-align:center;min-height:36px;padding:10px;font-weight:bold}.result{display:none;text-align:center;background:#fff7d9;border-radius:14px;padding:12px}.result.show{display:block}.result strong{color:#15934c;font-size:21px}@media(max-width:760px){.layout{grid-template-columns:1fr}.scene{min-height:240px}.app{padding:10px}}
</style></head><body><main class="app">
<header class="top"><b class="brand">Я УМЕЮ!</b><span class="pill">Задание 1 из 1</span><button class="pill" onclick="say(task.sentence)" aria-label="Прочитать предложение">🔊</button></header>
<section class="panel prompt"><div class="sentence" id="sentence">Мальчик кладёт красный мяч в коробку.</div><div class="hint">Прочитай внимательно и собери предложение из картинок</div></section>
<section class="layout"><div class="panel"><div class="scene" aria-label="Мальчик кладёт красный мяч в коробку"><span class="boy">👦</span><span class="ball">🔴</span><span class="box">📦</span></div><div class="caption">Ситуация для понимания предложения</div></div>
<div class="panel"><h2>Собери предложение</h2><div id="groups"></div><div class="slots" id="slots"></div><div class="controls"><button class="check" onclick="check()">Проверить</button><button class="reset" onclick="reset()">Начать заново</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="result" id="result"><strong>Отлично! Ты справился!</strong><p>Предложение собрано правильно.</p><button class="next" onclick="say('Следующее задание добавим позже')">Дальше →</button></div></div></section>
</main><script>
const task={sentence:'Мальчик кладёт красный мяч в коробку.',answer:{who:'boy',action:'put',object:'red',place:'box'}};
const groups=[
{id:'who',title:'КТО?',items:[['boy','👦','Мальчик'],['girl','👧','Девочка']]},
{id:'action',title:'ЧТО ДЕЛАЕТ?',items:[['put','🫳','Кладёт'],['throw','🤾','Бросает']]},
{id:'object',title:'КАКОЙ МЯЧ?',items:[['red','🔴','Красный мяч'],['yellow','🟡','Жёлтый мяч']]},
{id:'place',title:'КУДА?',items:[['box','📦','В коробку'],['table','🪑','На стол']]}];
const names={who:'Кто?',action:'Что делает?',object:'Какой мяч?',place:'Куда?'};
const selected={who:null,action:null,object:null,place:null};
function draw(){document.getElementById('groups').innerHTML=groups.map(g=>'<div class="group"><h3>'+g.title+'</h3><div class="options">'+g.items.map(i=>'<button class="option" title="'+i[2]+'" aria-label="'+i[2]+'" aria-pressed="'+(selected[g.id]===i[0])+'" onclick="pick(\''+g.id+'\',\''+i[0]+'\')">'+i[1]+'</button>').join('')+'</div></div>').join('');document.getElementById('slots').innerHTML=groups.map(g=>{let i=g.items.find(x=>x[0]===selected[g.id]);return '<div class="slot '+(i?'filled':'')+'"><small>'+names[g.id]+'</small><b>'+(i?i[2]:'—')+'</b>'+(i?'<button onclick="pick(\''+g.id+'\',null)">изменить</button>':'')+'</div>'}).join('')}
function pick(g,id){selected[g]=id;draw();document.getElementById('feedback').textContent='';document.getElementById('result').classList.remove('show')}
function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';speechSynthesis.speak(u)}
function check(){let f=document.getElementById('feedback');if(Object.values(selected).some(x=>!x)){f.textContent='Собери все части предложения.';return}let ok=Object.keys(task.answer).every(k=>selected[k]===task.answer[k]);if(!ok){f.textContent='';say('Посмотри внимательно');return}f.textContent='';document.getElementById('result').classList.add('show');say('Молодец! '+task.sentence)}
function reset(){Object.keys(selected).forEach(k=>selected[k]=null);draw();document.getElementById('feedback').textContent='';document.getElementById('result').classList.remove('show')}
draw();
</script></body></html>

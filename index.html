<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Где мяч? Мультяшные картинки — версия 5</title>
  <style>
    :root{--ink:#202535;--violet:#6656d9;--soft:#f2efff;--mint:#ccefe4;--yellow:#ffe37a;--red:#ef8c86;--shadow:0 12px 34px rgba(61,53,112,.13)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f8f6ff,#eef8fb);font-family:Arial,"Trebuchet MS",sans-serif;color:var(--ink)}
    button{font:inherit}.app{width:min(1080px,100%);margin:auto;min-height:100vh;padding:18px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:var(--violet);font-size:clamp(1.15rem,3vw,1.65rem)}
    .iconbtn,.small{border:0;border-radius:16px;background:#fff;color:var(--violet);font-weight:900;padding:11px 16px;box-shadow:0 4px 0 #ded9fb;cursor:pointer}.main{flex:1;display:grid;place-items:center;padding:18px 0}.panel{width:min(900px,100%);padding:clamp(18px,4vw,38px);background:rgba(255,255,255,.95);border:4px solid white;border-radius:32px;box-shadow:var(--shadow);text-align:center}
    h1{margin:4px 0 10px;font-size:clamp(1.7rem,5vw,3rem)}.instruction{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:900;margin:8px 0 12px}.quiet{color:#747a8c;margin:8px 0 18px}.scene{width:min(520px,100%);height:310px;margin:0 auto 18px;border-radius:26px;background:linear-gradient(155deg,#eaf7ff 0 68%,#dcebd7 68%);border:3px solid #e2e7f4;position:relative;overflow:hidden;perspective:800px}.scene:before{content:"";position:absolute;width:310px;height:36px;border-radius:50%;background:rgba(55,68,82,.13);left:50%;bottom:35px;transform:translateX(-50%);filter:blur(5px)}.ground{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(#dfefda,#cadfc4)}.box{position:absolute;width:156px;height:102px;left:49%;bottom:63px;transform:translateX(-50%);z-index:2}.box-back{position:absolute;left:0;top:0;width:132px;height:82px;background:linear-gradient(135deg,#dfaa6b,#bd7f43);border:4px solid #4c321f;border-radius:6px;transform:skewY(7deg);box-shadow:inset 0 10px 18px rgba(73,42,18,.22)}.box-side{position:absolute;right:0;top:12px;width:31px;height:87px;background:linear-gradient(135deg,#c98b4e,#a96835);border:4px solid #4c321f;clip-path:polygon(0 0,100% 14%,100% 100%,0 86%)}.box-inner{position:absolute;left:13px;top:8px;width:117px;height:37px;background:#704824;border:4px solid #4c321f;border-radius:50%;transform:rotate(4deg);box-shadow:inset 0 10px 12px #382516}.box-front{position:absolute;left:0;bottom:0;width:132px;height:70px;background:linear-gradient(145deg,#efbd7e,#ca8648);border:4px solid #4c321f;border-radius:5px;transform:skewY(7deg);z-index:5}.box-front:after{content:"";position:absolute;left:18px;right:18px;top:15px;height:4px;border-radius:4px;background:rgba(91,55,27,.35)}.ball{position:absolute;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 30% 24%,#fff7a8 0 8%,#ffd857 24%,#efa822 72%,#c77b15 100%);border:4px solid #44321b;z-index:6;transition:.35s;box-shadow:inset -10px -9px 12px rgba(112,62,5,.25),0 10px 12px rgba(45,43,40,.2)}.ball:before,.ball:after{content:"";position:absolute;border:3px solid rgba(86,57,21,.55);border-radius:50%}.ball:before{width:42px;height:17px;left:12px;top:25px;transform:rotate(28deg)}.ball:after{width:20px;height:42px;left:25px;top:11px;transform:rotate(-24deg)}.chair{position:absolute;width:104px;height:98px;bottom:59px;border:4px solid #284d4a;background:linear-gradient(145deg,#b7e8df,#6ebcb3);border-radius:12px 12px 5px 5px;box-shadow:9px 8px 0 #4b8f88,0 12px 12px rgba(42,64,66,.16);transform:skewY(-2deg)}.chair:before{content:"";position:absolute;width:88px;height:35px;left:4px;top:-45px;background:linear-gradient(145deg,#c7efe8,#77c6bd);border:4px solid #284d4a;border-radius:14px 14px 5px 5px}.chair:after{content:"";position:absolute;left:14px;right:14px;top:27px;border-top:4px solid #284d4a}.chair.left{left:17%}.chair.right{right:17%;transform:skewY(2deg)}
    .scene-picture{width:100%;height:100%;display:block;object-fit:cover}.scene.has-picture:before,.scene.has-picture .ground,.scene.has-picture .chair,.scene.has-picture .ball,.scene.has-picture .box{display:none}
    .choices{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.choice{min-height:122px;border:3px solid #cdc8ef;border-radius:20px;background:#fff;box-shadow:0 6px 0 #cdc8ef;cursor:pointer;padding:8px;font-weight:900;font-size:1.05rem}.choice:hover{transform:translateY(-2px)}.choice.good,.choice.show{background:var(--mint);border-color:#56b79a;box-shadow:0 6px 0 #56b79a}.choice.wrong{animation:shake .3s;background:#fff2f1;border-color:var(--red)}.picto{display:block;width:74px;height:62px;margin:0 auto 5px;position:relative}.p-box{position:absolute;width:42px;height:29px;border:4px solid #111;left:16px;bottom:3px;background:#fff}.p-ball{position:absolute;width:19px;height:19px;border:4px solid #111;border-radius:50%;background:#111}.p-on .p-ball{left:28px;top:11px}.p-under .p-box{bottom:24px}.p-under .p-ball{left:28px;bottom:0}.p-in .p-ball{left:28px;bottom:9px}.p-behind .p-ball{left:48px;bottom:8px;z-index:0}.p-behind .p-box{z-index:1}.p-between .p-box{display:none}.p-between:before,.p-between:after{content:"";position:absolute;width:20px;height:34px;border:4px solid #111;bottom:8px;background:#fff}.p-between:before{left:0}.p-between:after{right:0}.p-between .p-ball{left:28px;bottom:12px}
    .feedback{min-height:44px;margin-top:16px;font-weight:900;font-size:1.25rem}.listen{border:0;background:var(--yellow);box-shadow:0 6px 0 #e3bf3d;border-radius:18px;padding:13px 22px;font-weight:900;cursor:pointer}.next{border:0;background:var(--violet);color:#fff;box-shadow:0 6px 0 #473ab4;border-radius:18px;padding:14px 26px;font-weight:900;cursor:pointer}.prev{border:3px solid #cdc8ef;background:#fff;color:#393071;box-shadow:0 5px 0 #cdc8ef;border-radius:18px;padding:11px 22px;font-weight:900;cursor:pointer}.prev:disabled{opacity:.38;cursor:default;box-shadow:none}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.stepdots{display:flex;justify-content:center;gap:8px;margin:0 0 14px}.stepdots i{width:13px;height:13px;border-radius:50%;background:#ddd9f6}.stepdots i.active{background:var(--violet)}
    .story-scene{width:min(620px,100%);height:340px;margin:0 auto 18px;border-radius:26px;border:3px solid #dbe3f1;position:relative;overflow:hidden;background:linear-gradient(#bde8ff 0 58%,#88ce78 58%);box-shadow:inset 0 -16px 28px rgba(42,89,55,.12)}
    .story-scene .scene-picture{object-fit:contain;background:#f4f9ff}
    .sun{position:absolute;right:34px;top:24px;width:55px;height:55px;border-radius:50%;background:#ffe36e;box-shadow:0 0 0 10px rgba(255,227,110,.22)}.cloud{position:absolute;left:45px;top:35px;width:82px;height:30px;background:#fff;border-radius:30px;opacity:.85}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:38px;height:38px;left:12px;top:-18px}.cloud:after{width:46px;height:46px;right:5px;top:-22px}
    .tree{position:absolute;bottom:66px;width:30px;height:145px;background:#8d5b34;border:3px solid #4d3929;border-radius:8px;z-index:3}.tree:before{content:"";position:absolute;width:105px;height:105px;border-radius:48% 52% 44% 56%;background:#50a854;border:4px solid #2e7138;left:50%;top:-58px;transform:translateX(-50%)}.tree.one{left:17%}.tree.two{right:17%}
    .fence{position:absolute;left:7%;right:7%;bottom:57px;height:104px;z-index:6;background:repeating-linear-gradient(90deg,#d89a55 0 42px,#754923 42px 47px);border-top:8px solid #754923;border-bottom:8px solid #754923;clip-path:polygon(0 18%,5% 0,10% 18%,15% 0,20% 18%,25% 0,30% 18%,35% 0,40% 18%,45% 0,50% 18%,55% 0,60% 18%,65% 0,70% 18%,75% 0,80% 18%,85% 0,90% 18%,95% 0,100% 18%,100% 100%,0 100%)}
    .river{position:absolute;left:-5%;right:-5%;bottom:0;height:135px;background:linear-gradient(165deg,#6ed1ed,#3ca6d2);transform:skewY(-3deg);z-index:2}.river:after{content:"";position:absolute;left:8%;right:8%;top:35px;height:5px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 30px,transparent 30px 55px);border-radius:50%}
    .mini-chair{position:absolute;left:50%;bottom:58px;width:112px;height:76px;transform:translateX(-50%);background:#f3bc62;border:5px solid #664320;border-radius:10px;z-index:5}.mini-chair:before{content:"";position:absolute;left:7px;right:7px;top:-75px;height:72px;background:#f7cb7d;border:5px solid #664320;border-radius:14px 14px 5px 5px}.mini-chair:after{content:"";position:absolute;left:15px;right:15px;bottom:-62px;height:60px;border-left:8px solid #664320;border-right:8px solid #664320}
    .hero{--c:#6cc8f1;position:absolute;left:50%;bottom:67px;width:90px;height:90px;transform:translateX(-50%);border-radius:50%;background:var(--c);border:4px solid #34475a;z-index:5;display:grid;place-items:center;font-size:45px;filter:drop-shadow(0 8px 5px rgba(34,55,60,.18))}.hero:after{content:attr(data-name);position:absolute;top:92px;background:rgba(255,255,255,.9);padding:4px 9px;border-radius:10px;font-size:14px;font-weight:900;white-space:nowrap}.hero.krosh{--c:#69cef2}.hero.nyusha{--c:#f58caf}.hero.panda{--c:#fff}.hero.barash{--c:#c7a2e7}
    .behind-fence .hero{bottom:79px;z-index:4}.behind-tree .hero{left:24%;bottom:65px;z-index:2}.between-trees .hero{bottom:62px}.in-river .hero{bottom:38px;z-index:4}.on-chair .hero{bottom:151px;z-index:7}.under-chair .hero{bottom:25px;z-index:4;transform:translateX(-50%) scale(.78)}
    .stage-badge{display:inline-block;background:#ece9ff;color:#5545c3;border-radius:999px;padding:7px 13px;font-weight:900;margin-bottom:4px}.hero-choice .picto{filter:none}.transition-cast{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}.face{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:38px;border:3px solid #43516a}.face:nth-child(1){background:#69cef2}.face:nth-child(2){background:#f58caf}.face:nth-child(3){background:#fff}.face:nth-child(4){background:#c7a2e7}
    /* Более наглядные пиктограммы ПОД и ЗА */
    .p-under .p-ball{bottom:5px}
    .p-behind .p-ball{left:52px;top:18px;bottom:auto;z-index:0}
    .p-behind .p-box{left:14px;bottom:4px;width:40px;height:27px;z-index:2}
    .p-behind .p-box:before{content:"";position:absolute;left:2px;top:-10px;width:36px;height:9px;border:4px solid #111;border-bottom:0;background:#fff;transform:skewX(-32deg);transform-origin:left bottom}
    .p-behind .p-box:after{content:"";position:absolute;right:-11px;top:-5px;width:10px;height:27px;border:4px solid #111;border-left:0;background:#fff;transform:skewY(-32deg);transform-origin:left top}

    .welcome-main{min-height:100vh;padding:24px 0}.welcome-panel{min-height:650px;display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,.86fr);align-items:center;gap:20px;overflow:hidden;background:radial-gradient(circle at 78% 28%,#fff3b7 0,transparent 34%),linear-gradient(145deg,#fff,#eef9ff)}
    .welcome-copy{text-align:left;padding-left:clamp(4px,3vw,28px)}.welcome-copy h1{font-size:clamp(2.8rem,8vw,5.4rem);color:var(--violet);margin:0 0 8px}.welcome-copy p{font-size:clamp(1.45rem,4vw,2.3rem);line-height:1.18;font-weight:900;margin:0 0 30px;color:var(--ink)}
    .welcome-start{border:0;background:var(--violet);color:#fff;box-shadow:0 7px 0 #473ab4;border-radius:22px;padding:18px 34px;font-size:1.35rem;font-weight:900;cursor:pointer}.welcome-hero{width:100%;height:610px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 16px 14px rgba(56,53,95,.18))}
    @media(max-width:720px){.welcome-panel{min-height:700px;grid-template-columns:1fr;gap:0}.welcome-copy{text-align:center;padding:10px 6px 0;z-index:2}.welcome-copy p{margin-bottom:18px}.welcome-hero{height:390px;margin-top:-12px}}
    @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
    @media(max-width:720px){.app{padding:10px}.panel{padding:17px 10px;border-radius:24px}.scene{height:270px}.choices{grid-template-columns:repeat(3,1fr)}.choice{min-height:108px}.chair.left{left:10%}.chair.right{right:10%}}
    @media(max-width:420px){.choices{grid-template-columns:repeat(2,1fr)}.scene{height:250px}.scene[data-prep="on"] .ball{bottom:178px}.chair.left{left:7%}.chair.right{right:7%}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>

let index=0,mode='learn',stage='boxes',locked=false,correctCount=0;
let speechToken=0;
function russianVoice(){const voices=speechSynthesis.getVoices();return voices.find(v=>/^ru[-_]/i.test(v.lang)&&/female|alena|milena|irina|svetlana|katya|google/i.test(v.name))||voices.find(v=>/^ru[-_]/i.test(v.lang))}
function speak(text,onDone){const token=++speechToken;if(!('speechSynthesis'in window)){if(onDone)setTimeout(onDone,900);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';const voice=russianVoice();if(voice)u.voice=voice;u.rate=.64;u.pitch=1;u.onend=()=>{if(token===speechToken&&onDone)onDone()};u.onerror=()=>{if(token===speechToken&&onDone)onDone()};speechSynthesis.speak(u)}
function pictogram(x){if(x.id==='behind')return `<span class="picto"><svg viewBox="0 0 74 62" width="74" height="62" aria-hidden="true"><circle cx="58" cy="17" r="10" fill="#111"/><polygon points="12,25 22,14 58,14 48,25" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/><polygon points="48,25 58,14 58,42 48,53" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/><rect x="12" y="25" width="36" height="28" fill="#fff" stroke="#111" stroke-width="4"/></svg></span><span>${x.word}</span>`;return `<span class="picto p-${x.id}"><i class="p-box"></i><i class="p-ball"></i></span><span>${x.word}</span>`}
function shuffledStoryChoices(correctId){const choices=[...ITEMS];for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]]}const usual=ITEMS.findIndex(o=>o.id===correctId),current=choices.findIndex(o=>o.id===correctId);if(current===usual){const swap=(current+1+Math.floor(Math.random()*(choices.length-1)))%choices.length;[choices[current],choices[swap]]=[choices[swap],choices[current]]}return choices}
function dots(){const list=stage==='boxes'?ITEMS:STORIES;return `<div class="stepdots">${list.map((_,i)=>`<i class="${i===index?'active':''}"></i>`).join('')}</div>`}
function storyScene(x){return `<div class="story-scene" role="img" aria-label="${x.phrase}"><img class="scene-picture" src="${STORY_PICTURES[x.key||x.id]}" alt="${x.phrase}"></div>`}
function renderWelcome(){document.getElementById('root').innerHTML=`<div class="app"><section class="main welcome-main"><div class="panel welcome-panel"><div class="welcome-copy"><span class="stage-badge">УЧИМСЯ ИГРАЯ</span><h1>ПРИВЕТ!</h1><p>Давай учить предлоги вместе!</p><button class="welcome-start" onclick="restart()">НАЧАТЬ ▶</button></div><img class="welcome-hero" src="${WELCOME_HERO}" alt="Мультяшный мальчик машет рукой"></div></section></div>`;setTimeout(()=>speak('Привет! Давай учить предлоги вместе!'),350)}
function render(){if(stage==='boxes')renderBoxes();else renderStories()}
function renderBoxes(){const x=ITEMS[index],back=`<button class="prev" onclick="prev()" ${index===0?'disabled':''}>◀ НАЗАД</button>`;document.getElementById('root').innerHTML=`<div class="app"><header class="top"><button class="iconbtn" onclick="home()">⌂</button><div class="brand">ГДЕ МЯЧ?</div><button class="iconbtn" onclick="repeat()" aria-label="Повторить">🔊</button></header><section class="main"><div class="panel"><span class="stage-badge">1. МЯЧ И ЯЩИК</span>${dots()}<h1>${mode==='learn'?'СМОТРИ И СЛУШАЙ':'ПОСМОТРИ. ГДЕ МЯЧ?'}</h1><p class="instruction">${mode==='learn'?x.phrase:'Покажи правильную карточку'}</p><div class="scene has-picture" data-prep="${x.id}" role="img" aria-label="${x.phrase}"><img class="scene-picture" src="${PICTURES[x.id]}" alt="${x.phrase}"></div>${mode==='learn'?`<div class="choices"><button class="choice good" onclick="repeat()">${pictogram(x)}</button></div><div class="feedback">${x.phrase}</div><div class="actions">${back}<button class="listen" onclick="repeat()">🔊 ЕЩЁ РАЗ</button><button class="next" onclick="next()">ДАЛЬШЕ ▶</button></div>`:`<div class="choices">${ITEMS.map(o=>`<button class="choice" onclick="choose(this,'${o.id}')">${pictogram(o)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions">${back}</div>`}</div></section></div>`;setTimeout(()=>speak(mode==='learn'?x.speech:'Где мяч?'),350)}
function renderStories(){const x=STORIES[index],storyOptions=mode==='practice'?shuffledStoryChoices(x.id):ITEMS,back=`<button class="prev" onclick="prev()" ${index===0?'disabled':''}>◀ НАЗАД</button>`;document.getElementById('root').innerHTML=`<div class="app"><header class="top"><button class="iconbtn" onclick="home()">⌂</button><div class="brand">ГДЕ ГЕРОЙ?</div><button class="iconbtn" onclick="repeat()" aria-label="Повторить">🔊</button></header><section class="main"><div class="panel"><span class="stage-badge">2. ГЕРОИ ВОКРУГ НАС</span>${dots()}<h1>${mode==='learn'?'СМОТРИ И СЛУШАЙ':'ГДЕ '+x.hero.toUpperCase()+'?'}</h1><p class="instruction">${mode==='learn'?x.phrase:'Покажи правильную карточку'}</p>${storyScene(x)}${mode==='learn'?`<div class="choices"><button class="choice good hero-choice" onclick="repeat()">${pictogram(x)}</button></div><div class="feedback">${x.phrase}</div><div class="actions">${back}<button class="listen" onclick="repeat()">🔊 ЕЩЁ РАЗ</button><button class="next" onclick="next()">ДАЛЬШЕ ▶</button></div>`:`<div class="choices">${storyOptions.map(o=>`<button class="choice" onclick="choose(this,'${o.id}')">${pictogram(o)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions">${back}</div>`}</div></section></div>`;setTimeout(()=>speak(mode==='learn'?x.phrase:'Где '+x.hero+'?'),350)}
function repeat(){const x=stage==='boxes'?ITEMS[index]:STORIES[index];speak(mode==='learn'?(x.speech||x.phrase):(stage==='boxes'?'Где мяч?':'Где '+x.hero+'?'))}
function next(){const list=stage==='boxes'?ITEMS:STORIES;index++;if(index>=list.length){index=0;mode='practice'}render()}
function prev(){if(index<=0)return;if('speechSynthesis'in window)speechSynthesis.cancel();index--;locked=false;render()}
function choose(btn,id){if(locked)return;const list=stage==='boxes'?ITEMS:STORIES,x=list[index];if(id===x.id){locked=true;btn.classList.add('good');document.getElementById('feedback').textContent='Верно! '+x.phrase;correctCount++;speak('Правильно. '+(x.speech||x.phrase),()=>setTimeout(()=>{index++;if(index>=list.length){stage==='boxes'?showTransition():finish();return}locked=false;render()},650))}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='Попробуй ещё раз';speak('Попробуй ещё раз');setTimeout(()=>btn.classList.remove('wrong'),500)}}
function showTransition(){document.querySelector('.panel').innerHTML=`<div style="font-size:4.5rem">⭐</div><h1>МЯЧ И ЯЩИКИ ИЗУЧЕНЫ!</h1><p class="instruction">Теперь поиграем с любимыми героями в настоящих местах</p><div class="transition-cast"><i class="face">🐰</i><i class="face">🐷</i><i class="face">🐼</i><i class="face">🐑</i></div><button class="next" onclick="startStories()">К ГЕРОЯМ ▶</button>`;speak('Молодец! Теперь поиграем с любимыми героями')}
function startStories(){stage='stories';index=0;mode='learn';locked=false;render()}
function finish(){document.querySelector('.panel').innerHTML=`<div style="font-size:5rem">🌟</div><h1>МОЛОДЕЦ!</h1><p class="instruction">Ты прошёл 10 заданий и закрепил предлоги: на, под, за, между и в</p><div class="actions"><button class="listen" onclick="startStories()">ПОВТОРИТЬ ГЕРОЕВ</button><button class="next" onclick="home()">С САМОГО НАЧАЛА</button></div>`;speak('Молодец! Ты отлично справился')}
function restart(){index=0;mode='learn';stage='boxes';locked=false;correctCount=0;render()}function home(){if('speechSynthesis'in window)speechSynthesis.cancel();index=0;mode='learn';stage='boxes';locked=false;correctCount=0;renderWelcome()}
renderWelcome();
</script></body></html>
